# /etc/nginx/sites-available/frins.in
#
# Proxies the whole site to the FRINS Node process on 127.0.0.1:3100.
# The app serves both the API and the built React files, so there is no
# try_files rule and no PHP block here.
#
# Leave every other file in sites-enabled alone. Add this one, test, reload.

server {
    listen 80;
    listen [::]:80;
    server_name frins.in www.frins.in;

    # Student uploads travel as JSON, so allow a little headroom over the
    # server's 1 MB body limit.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Long enough for a live-LLM run, short enough to fail fast.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_buffer_size 16k;
    }

    # Hashed Vite assets never change, so cache them hard.
    location /assets/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/frins.in.access.log;
    error_log  /var/log/nginx/frins.in.error.log;
}
