# /etc/nginx/sites-available/frins.in
# or /etc/nginx/conf.d/frins.in.conf on AlmaLinux / Rocky
#
# FRINS: one Node process on 127.0.0.1:3100 serves both the API and the
# built React files, so nginx only proxies. There is no try_files rule, no
# PHP block and no second site for the API.
#
# Install:
#   sudo cp /var/www/frins.in/deploy/nginx-frins.in.conf /etc/nginx/sites-available/frins.in
#   sudo ln -s /etc/nginx/sites-available/frins.in /etc/nginx/sites-enabled/frins.in
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d frins.in -d www.frins.in --redirect
#
# certbot edits this file in place and adds the 443 server block.

server {
    listen 80;
    listen [::]:80;
    server_name frins.in www.frins.in;

    # Student uploads are sent as JSON. The app allows 1 MB, so give nginx a
    # little headroom or uploads fail with 413 before reaching Node.
    client_max_body_size 2m;

    # Response headers. These are inherited by every location below, as long
    # as no location adds its own add_header.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Hashed build output never changes, so cache it hard.
    # `expires` is used instead of add_header so the headers above still apply.
    location /assets/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        expires 1y;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Generous for a live AI run, short enough to fail fast.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        proxy_buffers 16 16k;
        proxy_buffer_size 16k;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    access_log /var/log/nginx/frins.in.access.log;
    error_log  /var/log/nginx/frins.in.error.log warn;
}
