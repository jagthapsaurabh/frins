# OPTIONAL: send www.frins.in to https://frins.in
#
# Skip this if you do not care whether visitors land on the www or the bare
# domain. Both names work without it; this only picks one canonical address.
#
# Do this AFTER certbot has issued the certificate.
#
# 1. In /etc/nginx/sites-available/frins.in.conf, in the 443 block that certbot
#    created, change:
#
#        server_name frins.in www.frins.in;
#
#    to:
#
#        server_name frins.in;
#
# 2. Copy this file into place and point it at the same certificate:
#
#        sudo cp /var/www/frins/deploy/nginx-www-redirect.conf /etc/nginx/sites-available/frins-www.conf
#        sudo ln -s /etc/nginx/sites-available/frins-www.conf /etc/nginx/sites-enabled/frins-www.conf
#
#    Check the two ssl_certificate paths below match the ones in your main file:
#        sudo grep -n ssl_certificate /etc/nginx/sites-available/frins.in.conf
#
# 3. Test and reload:
#
#        sudo nginx -t && sudo systemctl reload nginx
#        curl -I https://www.frins.in        # expect 301 to https://frins.in/

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name www.frins.in;

    ssl_certificate     /etc/letsencrypt/live/frins.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frins.in/privkey.pem;

    return 301 https://frins.in$request_uri;
}

# Port 80 for www is already handled: certbot's 80 block redirects every
# name to HTTPS, and the block above then sends www to the bare domain.
