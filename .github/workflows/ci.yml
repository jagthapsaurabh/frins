name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Smoke test the server
        run: |
          NODE_ENV=production PORT=3100 npm start &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/api/health > /dev/null; then
              echo "health ok"
              curl -fsS http://127.0.0.1:3100/api/health
              exit 0
            fi
            sleep 1
          done
          echo "server did not become healthy"
          exit 1
